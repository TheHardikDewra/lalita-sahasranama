name: Deploy to GitHub Pages

# GitHub Pages is switched off for this repo (the site is served by Vercel at
# lalita-sahasranama.com), so this job failed on every push. It now runs only
# when started by hand. To bring Pages back: enable Pages (source: GitHub Actions)
# and restore the push trigger below.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
